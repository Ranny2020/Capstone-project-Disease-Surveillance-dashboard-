<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | HealthWatch</title>
  <link rel="stylesheet" href="forgot-password.css" />
</head>
<body>
  <div class="forgot-shell">
    <main class="forgot-main">
      <div class="forgot-card">
        <div class="forgot-icon" aria-hidden="true">
          <span>&#128274;</span>
        </div>
        <h1>Forgot Password</h1>
        <p>Enter your email address and we’ll send you a link to reset your password.</p>

        <form class="forgot-form" action="#" method="post">
          <label class="input-wrapper">
            <span class="input-icon">&#9993;</span>
            <input class="text-input" type="email" name="email" placeholder="Email Address" required />
          </label>

          <button class="primary-button" type="submit">Send Reset Link</button>
        </form>

        <a class="back-link" href="login.html">Back to login</a>
      </div>
    </main>
  </div>
</body>
</html>
