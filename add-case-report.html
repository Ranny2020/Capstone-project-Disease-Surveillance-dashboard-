<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthWatch | Add Case Report</title>
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    :root { --case-green: #045844; --case-border: #2d8272; --case-muted: #4c5d59; }
    * { box-sizing: border-box; }
    body { background: #fff; color: #111; }
    .case-page { padding: 30px 28px 40px; max-width: 1040px; }
    .back-link { color: #222; text-decoration: none; font-size: 1rem; }
    .case-heading { margin: 12px 0 14px; }
    .case-heading h1 { margin: 0; font-size: 2rem; }
    .case-heading p { margin: 4px 0 0; font-size: 1rem; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); position: relative; margin: 14px 38px 42px; }
    .steps::before { content: ""; position: absolute; top: 27px; left: 15%; right: 15%; border-top: 2px solid #222; }
    .step { position: relative; z-index: 1; display: grid; justify-items: center; gap: 7px; color: #222; font-size: .82rem; text-align: center; }
    .step-number { display: grid; place-items: center; width: 54px; height: 54px; border: 2px solid var(--case-green); border-radius: 50%; background: #fff; font-size: 1.4rem; font-weight: 700; }
    .step.active .step-number { background: var(--case-green); color: #fff; }
    .case-form { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 102px; }
    .field { display: grid; gap: 9px; }
    .field label, .classification legend { font-weight: 700; font-size: 1rem; }
    .required { color: #e11; }
    input, select { width: 100%; height: 36px; border: 1px solid var(--case-border); border-radius: 7px; padding: 0 11px; background: #fff; font-size: 1rem; color: #222; }
    .classification { grid-column: 1 / -1; border: 2px solid var(--case-border); border-radius: 9px; padding: 11px 24px 12px; }
    .classification legend { padding: 0 0; }
    .classification label { display: grid; grid-template-columns: 20px auto; gap: 7px; align-items: start; margin-top: 10px; }
    .classification input { width: 22px; height: 22px; accent-color: var(--case-green); }
    .classification span { display: grid; gap: 2px; }
    .classification small { color: var(--case-muted); font-weight: 400; }
    .location-fields { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 44px; }
    .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 12px; }
    .button { border: 0; border-radius: 7px; padding: 10px 24px; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .button.primary { background: var(--case-green); color: #fff; }
    .button.secondary { background: #e5f0ed; color: var(--case-green); }
    @media (max-width: 800px) { .case-page { padding: 24px 18px; } .case-form { gap: 18px; } .case-form, .location-fields { grid-template-columns: 1fr; } .classification, .location-fields, .form-actions { grid-column: auto; } .location-fields { gap: 18px; } .steps { margin-inline: 0; } }
  </style>
</head>
<body>
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><img class="sidebar-logo" src="logo.png" alt="HealthWatch logo" /></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="disease-report.html" class="sidebar-link">Disease Report</a>
        <a href="C-R.html" class="sidebar-link active">Case Reporting</a>
        <a href="analytics.html" class="sidebar-link">Analytics</a>
        <a href="#" class="sidebar-link">Interactive Map</a>
        <a href="health-facilities.html" class="sidebar-link">Health Facilities</a>
        <a href="health-alerts.html" class="sidebar-link">Health Alerts</a>
        <a href="user-profile.html" class="sidebar-link">Users</a>
        <a href="user-security.html" class="sidebar-link">Settings</a>
      </nav>
      <a class="logout-button" href="login.html">Log Out</a>
    </aside>

    <main class="dashboard-main case-page">
      <a class="back-link" href="C-R.html">← Back</a>
      <section class="case-heading">
        <h1>Add New Case Report</h1>
        <p>steps 1 of 3 case information</p>
      </section>

      <div class="steps" aria-label="Case report steps">
        <div class="step active"><span class="step-number">1</span><span>Case Information</span></div>
        <div class="step"><span class="step-number">2</span><span>Patient Information</span></div>
        <div class="step"><span class="step-number">3</span><span>Review &amp; submit</span></div>
      </div>

      <form class="case-form" id="caseReportForm">
        <div class="field">
          <label for="disease">Disease <span class="required">*</span></label>
          <select id="disease" name="disease" required>
            <option value="">Select disease</option><option>Lassa Fever</option><option>Measles</option><option>Cholera</option><option>COVID 19</option><option>Yellow Fever</option><option>Mpox</option><option>Diphtheria</option>
          </select>
        </div>
        <div class="field">
          <label for="onsetDate">Date of Onset <span class="required">*</span></label>
          <input id="onsetDate" name="onsetDate" type="date" required />
        </div>
        <div class="field">
          <label for="reportedDate">Date Reported</label>
          <input id="reportedDate" name="reportedDate" type="date" />
        </div>
        <div class="field">
          <label for="cases">Number of Cases</label>
          <input id="cases" name="cases" type="number" min="1" placeholder="Enter number of cases" />
        </div>

        <fieldset class="classification">
          <legend>Case Classification <span class="required">*</span></legend>
          <label><input type="radio" name="status" value="Suspected" required /><span>Suspected<small>Symptoms suggest the disease but not yet confirmed</small></span></label>
          <label><input type="radio" name="status" value="Probable" /><span>Probable<small>Likely case based on clinical evaluation</small></span></label>
          <label><input type="radio" name="status" value="Confirmed" /><span>Confirmed<small>Confirmed by laboratory or specific test</small></span></label>
        </fieldset>

        <div class="location-fields">
          <div class="field"><label for="state">Location of Case <span class="required">*</span></label><select id="state" name="state" required><option value="">Select state</option><option>Lagos</option><option>Kano</option><option>Kaduna</option><option>Kwara</option><option>Abuja</option></select></div>
          <div class="field"><label for="lga">&nbsp;</label><input id="lga" name="lga" placeholder="Enter LGA" required /></div>
          <div class="field"><label for="location">&nbsp;</label><input id="location" name="location" placeholder="Community / Facility" required /></div>
        </div>

        <div class="form-actions"><a class="button secondary" href="C-R.html">Cancel</a><button class="button primary" type="submit">Save &amp; Review</button></div>
      </form>
    </main>
  </div>

  <script>
    document.querySelector('#reportedDate').value = new Date().toISOString().slice(0, 10);
    document.querySelector('#caseReportForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const draft = {
        id: `NCDC-${String(data.get('disease')).slice(0, 3).toUpperCase()}-${Date.now().toString().slice(-6)}`,
        disease: data.get('disease'),
        location: data.get('location'),
        lga: data.get('lga'),
        state: data.get('state'),
        reportedDate: data.get('reportedDate'),
        onsetDate: data.get('onsetDate'),
        cases: data.get('cases'),
        status: data.get('status')
      };
      sessionStorage.setItem('healthwatchCaseDraft', JSON.stringify(draft));
      window.location.href = 'review.html';
    });
  </script>
</body>
</html>
